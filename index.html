<!DOCTYPE html>
<html>
<head>
  <title>Torn Market Hub</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial;
      background: #0b0f14;
      color: #e6edf3;
    }

    .nav {
      display: flex;
      background: #111827;
      padding: 15px;
      gap: 20px;
      justify-content: center;
      border-bottom: 1px solid #222;
    }

    .nav button {
      background: #1f2937;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .nav button:hover {
      background: #00ffcc;
      color: black;
    }

    .container {
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #111827;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    img {
      width: 80px;
    }

    .price {
      color: #00ffcc;
      font-weight: bold;
    }

    .deal {
      color: #22c55e;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 20px;
      background: #1f2937;
      color: white;
    }
  </style>
</head>

<body>

<div class="nav">
  <button onclick="tab('market')">Market</button>
  <button onclick="tab('flips')">Deals</button>
  <button onclick="tab('sniper')">Sniper</button>
</div>

<div class="container">

<div id="market">
  <h2>Live Market</h2>
  <div class="grid" id="marketGrid"></div>
</div>

<div id="flips" style="display:none;">
  <h2>Best Deals</h2>
  <div class="grid" id="dealGrid"></div>
</div>

<div id="sniper" style="display:none;">
  <h2>Sniper Tool</h2>
  <input placeholder="Enter item name..." id="snipeInput">
  <button onclick="startSniper()">Start Sniping</button>
  <div id="sniperResults"></div>
</div>

</div>

<script>
const API_KEY = "Tym7CAWL1JYBhRnN";

let items = [];
let sniperActive = false;

function tab(name){
  document.querySelectorAll(".container > div").forEach(d => d.style.display="none");
  document.getElementById(name).style.display="block";
}

async function load(){
  const res = await fetch(`https://api.torn.com/torn/?selections=items&key=${API_KEY}`);
  const data = await res.json();

  items = Object.values(data.items);

  renderMarket();
  findDeals();
}

function renderMarket(){
  const grid = document.getElementById("marketGrid");
  grid.innerHTML = "";

  items.slice(0,60).forEach(i=>{
    grid.innerHTML += `
      <div class="card">
        <img src="${i.image}">
        <h3>${i.name}</h3>
        <p class="price">$${i.market_value}</p>
      </div>
    `;
  });
}

function findDeals(){
  const deals = items.filter(i => i.market_value < i.buy_price * 0.8);

  const grid = document.getElementById("dealGrid");
  grid.innerHTML = "";

  deals.slice(0,30).forEach(i=>{
    grid.innerHTML += `
      <div class="card">
        <img src="${i.image}">
        <h3>${i.name}</h3>
        <p class="deal">UNDERVALUED</p>
        <p>$${i.market_value}</p>
      </div>
    `;
  });
}

function startSniper(){
  const query = document.getElementById("snipeInput").value.toLowerCase();
  sniperActive = true;

  const resultsDiv = document.getElementById("sniperResults");

  setInterval(()=>{
    if(!sniperActive) return;

    const found = items.filter(i =>
      i.name.toLowerCase().includes(query) &&
      i.market_value < i.buy_price * 0.7
    );

    if(found.length > 0){
      resultsDiv.innerHTML = "<h3>🔥 DEAL FOUND 🔥</h3>";

      found.forEach(i=>{
        resultsDiv.innerHTML += `
          <div class="card">
            <img src="${i.image}">
            <h3>${i.name}</h3>
            <p>$${i.market_value}</p>
          </div>
        `;
      });

      alert("Deal found!");
    }

  }, 10000); // checks every 10 sec
}

// AUTO REFRESH EVERY 30s
setInterval(load, 30000);

load();
</script>

</body>
</html>
