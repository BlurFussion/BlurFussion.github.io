<!DOCTYPE html>
<html>
<head>
  <title>Torn Market Hub</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial;
      background: #0b0f14;
      color: #e6edf3;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      padding: 15px;
      background: #111827;
      border-bottom: 1px solid #222;
    }

    .nav input {
      width: 300px;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #1f2937;
      color: white;
    }

    .nav-buttons button {
      margin-left: 10px;
      background: #1f2937;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }

    .nav-buttons button:hover {
      background: #00ffcc;
      color: black;
    }

    .container {
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #111827;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.05);
    }

    img {
      width: 70px;
    }

    .price { color: #00ffcc; }
    .deal { color: #22c55e; }

    .hidden { display: none; }

    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      padding: 40px;
      overflow-y: auto;
    }

    .modal-content {
      background: #111827;
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="nav">
  <input type="text" placeholder="Search items..." onkeyup="searchItems(this.value)">
  
  <div class="nav-buttons">
    <button onclick="showTab('market')">Market</button>
    <button onclick="showTab('deals')">Deals</button>
    <button onclick="showTab('settings')">Settings</button>
  </div>
</div>

<div class="container">

  <div id="market">
    <div class="grid" id="marketGrid"></div>
  </div>

  <div id="deals" class="hidden">
    <h2>Deals (20%+ under market value)</h2>
    <div class="grid" id="dealGrid"></div>
  </div>

  <div id="settings" class="hidden">
    <h2>Settings</h2>
    <input id="apiInput" placeholder="Enter API Key">
    <button onclick="saveKey()">Save Key</button>
  </div>

</div>

<div id="modal" class="modal" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h2 id="itemName"></h2>

    <h3>Item Market</h3>
    <div id="itemMarket"></div>

    <h3>Bazaar</h3>
    <div id="bazaar"></div>
  </div>
</div>

<script>
let API_KEY = localStorage.getItem("tornKey") || "";
let items = [];

function saveKey(){
  API_KEY = document.getElementById("apiInput").value;
  localStorage.setItem("tornKey", API_KEY);
  alert("Saved!");
  loadItems();
}

function showTab(tab){
  ["market","deals","settings"].forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });
  document.getElementById(tab).classList.remove("hidden");
}

async function loadItems(){
  if(!API_KEY) return;

  const res = await fetch(`https://api.torn.com/torn/?selections=items&key=${API_KEY}`);
  const data = await res.json();

  items = Object.entries(data.items).map(([id, val]) => ({id, ...val}));

  renderItems(items);
  renderDeals();
}

function renderItems(list){
  const grid = document.getElementById("marketGrid");
  grid.innerHTML = "";

  list.forEach(i=>{
    grid.innerHTML += `
      <div class="card" onclick="openItem(${i.id})">
        <img src="${i.image}">
        <h3>${i.name}</h3>
        <p class="price">$${i.market_value}</p>
      </div>
    `;
  });
}

function renderDeals(){
  const deals = items.filter(i => i.market_value && i.buy_price && i.market_value < i.buy_price * 0.8);

  const grid = document.getElementById("dealGrid");
  grid.innerHTML = "";

  deals.forEach(i=>{
    grid.innerHTML += `
      <div class="card" onclick="openItem(${i.id})">
        <img src="${i.image}">
        <h3>${i.name}</h3>
        <p class="deal">DEAL</p>
        <p>$${i.market_value}</p>
      </div>
    `;
  });
}

function searchItems(query){
  query = query.toLowerCase();
  const filtered = items.filter(i => i.name.toLowerCase().includes(query));
  renderItems(filtered);
}

async function openItem(id){
  document.getElementById("modal").style.display = "block";

  const item = items.find(i => i.id == id);
  document.getElementById("itemName").innerText = item.name;

  const res = await fetch(`https://api.torn.com/market/${id}?selections=itemmarket,bazaar&key=${API_KEY}`);
  const data = await res.json();

  const marketDiv = document.getElementById("itemMarket");
  const bazaarDiv = document.getElementById("bazaar");

  marketDiv.innerHTML = "";
  bazaarDiv.innerHTML = "";

  if(data.itemmarket){
    data.itemmarket.forEach(l=>{
      marketDiv.innerHTML += `<p>$${l.cost}</p>`;
    });
  }

  if(data.bazaar){
    data.bazaar.forEach(l=>{
      bazaarDiv.innerHTML += `<p>$${l.cost}</p>`;
    });
  }
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

loadItems();
</script>

</body>
</html>
